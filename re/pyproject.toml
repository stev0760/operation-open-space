[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isre"
version = "0.1.0"
description = "Reverse-engineering tools for Operation: Inner Space (Win16 NE)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
isre = "isre.cli:main"

[tool.setuptools]
packages = ["isre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
